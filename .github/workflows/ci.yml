# Smoke test on Windows, macOS and Linux: install, init a project, doctor, and record a real scene.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: init + doctor + record part 1 of the starter demo
        shell: bash
        run: |
          mkdir smoke && cd smoke
          node ../bin/talkthrough.mjs init
          node ../bin/talkthrough.mjs doctor || true
          node ../bin/talkthrough.mjs record --part part1
          ls -la demo/out
          test -s demo/out/part1.mp4
